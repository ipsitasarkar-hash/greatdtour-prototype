<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add New Program — Great D'Tour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { background: #f3f4f6; margin: 0; padding: 0; min-height: 100vh; font-family: 'Inter', sans-serif; }

    /* ── SIDEBAR ── */
    .hd-sidebar {
      position: fixed; left: 0; top: 0; bottom: 0; width: 256px;
      background: #101828; display: flex; flex-direction: column; z-index: 100; overflow-y: auto;
    }
    .hd-sidebar__logo { padding: 20px 24px 16px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 10px; }
    .hd-sidebar__logo-text { font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 700; color: #fff; }
    .hd-sidebar__info { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .hd-sidebar__info-identity { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .hd-sidebar__info-avatar { width: 42px; height: 42px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #f54900; flex-shrink: 0; }
    .hd-sidebar__info-name { font-size: 14px; font-weight: 600; color: #fff; }
    .hd-sidebar__info-email { font-size: 11px; color: #6b7280; margin-top: 2px; }
    .hd-sidebar__info-row { display: flex; justify-content: space-between; padding: 3px 0; }
    .hd-sidebar__info-label { font-size: 11px; color: #6b7280; }
    .hd-sidebar__info-val { font-size: 11px; font-weight: 500; color: #d1d5dc; }
    .hd-sidebar__info-val--green { color: #4ade80; }
    .hd-sidebar__nav { flex: 1; padding: 16px; }
    .hd-nav__group { margin-bottom: 2px; }
    .hd-nav__group-btn { display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 48px; border-radius: 10px; font-size: 15px; font-weight: 400; color: #d1d5dc; cursor: pointer; border: none; background: none; width: 100%; text-align: left; transition: all 0.15s; }
    .hd-nav__group-btn:hover { background: rgba(255,255,255,0.06); color: #fff; }
    .hd-nav__group-btn svg { flex-shrink: 0; width: 20px; height: 20px; opacity: 0.8; }
    .hd-nav__group-chevron { margin-left: auto; width: 16px; height: 16px; opacity: 0.5; transition: transform 0.2s; }
    .hd-nav__group.is-open .hd-nav__group-chevron { transform: rotate(180deg); }
    .hd-nav__sub { max-height: 0; overflow: hidden; transition: max-height 0.25s ease; padding-left: 16px; }
    .hd-nav__group.is-open .hd-nav__sub { max-height: 240px; }
    .hd-nav__sub-item { display: flex; align-items: center; gap: 8px; padding: 0 16px; height: 40px; border-radius: 8px; font-size: 14px; color: #9ca3b0; cursor: pointer; border: none; background: none; width: 100%; text-align: left; transition: all 0.15s; margin-bottom: 1px; }
    .hd-nav__sub-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
    .hd-nav__sub-item.is-active { color: #fff; background: rgba(255,255,255,0.08); font-weight: 500; }
    .hd-nav__sub-item::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: 0.5; flex-shrink: 0; }
    .hd-nav__sub-item.is-active::before { opacity: 1; background: #f54900; }
    .hd-nav__item { display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 48px; border-radius: 10px; font-size: 15px; color: #d1d5dc; cursor: pointer; border: none; background: none; width: 100%; text-align: left; transition: all 0.15s; margin-bottom: 2px; }
    .hd-nav__item:hover { background: rgba(255,255,255,0.06); color: #fff; }
    .hd-sidebar__footer { padding: 16px 20px; border-top: 1px solid rgba(255,255,255,0.1); }
    .hd-sidebar__footer-link { display: block; font-size: 13px; color: #6b7280; padding: 6px 0; cursor: pointer; }
    .hd-sidebar__footer-link:hover { color: #fff; }

    /* ── MAIN ── */
    .ap-main { margin-left: 256px; min-height: 100vh; padding: 0 0 72px; background: #f3f4f6; display: flex; flex-direction: column; }
    .ap-header { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 18px 32px 14px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; }
    .ap-header h1 { font-size: 20px; font-weight: 700; color: #101828; margin: 0; }
    .ap-header__sub { font-size: 13px; color: #9ca3af; margin-top: 2px; }

    /* ── STEPPER (horizontal, top) ── */
    .ap-stepper { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 0 32px; overflow-x: auto; }
    .ap-stepper-inner { display: flex; align-items: center; min-width: max-content; }
    .ap-step { display: flex; align-items: center; gap: 8px; padding: 14px 0; cursor: pointer; }
    .ap-step__num {
      width: 26px; height: 26px; border-radius: 50%; border: 2px solid #d1d5db;
      display: flex; align-items: center; justify-content: center; font-size: 11px;
      font-weight: 700; color: #9ca3af; background: #fff; flex-shrink: 0; transition: all 0.2s;
    }
    .ap-step.is-active .ap-step__num { background: #f54900; border-color: #f54900; color: #fff; }
    .ap-step.is-done .ap-step__num { background: #101828; border-color: #101828; color: #fff; font-size: 10px; }
    .ap-step__label { font-size: 12px; font-weight: 500; color: #9ca3af; white-space: nowrap; }
    .ap-step.is-active .ap-step__label { color: #f54900; font-weight: 600; }
    .ap-step.is-done .ap-step__label { color: #374151; }
    .ap-step-connector { flex: 0 0 32px; height: 2px; background: #e5e7eb; margin: 0 8px; }
    .ap-step-connector.is-done { background: #101828; }

    /* ── CONTENT AREA ── */
    .ap-body { padding: 28px 32px 0; }
    .ap-content { max-width: none; }

    /* ── CARDS / SECTIONS ── */
    .ap-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 28px; margin-bottom: 20px; }
    .ap-section-title { font-size: 11px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: #6b7280; margin-bottom: 20px; }
    .ap-section-title--lg { font-size: 20px; font-weight: 700; letter-spacing: 0; text-transform: none; color: #101828; margin-bottom: 6px; }
    .ap-section-sub { font-size: 13px; color: #6b7280; margin-bottom: 16px; }

    /* ── FORM ELEMENTS ── */
    .ap-label { font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 6px; display: block; }
    .ap-label .req { color: #f54900; margin-left: 2px; }
    .ap-input, .ap-select, .ap-textarea {
      width: 100%; padding: 9px 12px; border: 1px solid #d1d5db; border-radius: 8px;
      font-size: 14px; color: #101828; background: #fff; font-family: 'Inter', sans-serif;
      transition: border-color 0.15s;
    }
    .ap-input:focus, .ap-select:focus, .ap-textarea:focus { outline: none; border-color: #f54900; box-shadow: 0 0 0 3px rgba(245,73,0,0.08); }
    .ap-select { appearance: none; background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%236B7280' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"); background-repeat: no-repeat; background-position: right 12px center; padding-right: 32px; }
    .ap-textarea { resize: vertical; min-height: 120px; line-height: 1.6; }
    .ap-char-hint { font-size: 12px; color: #9ca3af; margin-top: 4px; }
    .ap-field-group { display: grid; gap: 16px; margin-bottom: 16px; }
    .ap-field-group--2 { grid-template-columns: 1fr 1fr; }
    .ap-field-group--3 { grid-template-columns: 1fr 1fr 1fr; }
    .ap-field { display: flex; flex-direction: column; }

    /* ── CHECKBOXES / RADIO ── */
    .ap-check-grid { display: grid; gap: 8px 20px; }
    .ap-check-grid--2 { grid-template-columns: 1fr 1fr; }
    .ap-check-grid--3 { grid-template-columns: 1fr 1fr 1fr; }
    .ap-check-label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #374151; cursor: pointer; user-select: none; }
    .ap-check-label input[type=checkbox], .ap-check-label input[type=radio] { width: 15px; height: 15px; accent-color: #f54900; flex-shrink: 0; cursor: pointer; }

    /* ── CATEGORY ACCORDION ── */
    .ap-cat-item { border: 1px solid #e5e7eb; border-radius: 10px; overflow: hidden; margin-bottom: 8px; }
    .ap-cat-header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; background: #fff; user-select: none; }
    .ap-cat-header:hover { background: #fafafa; }
    .ap-cat-header input[type=checkbox] { width: 16px; height: 16px; accent-color: #f54900; flex-shrink: 0; }
    .ap-cat-header__name { font-size: 14px; font-weight: 500; color: #101828; flex: 1; }
    .ap-cat-chevron { width: 16px; height: 16px; color: #9ca3af; transition: transform 0.2s; flex-shrink: 0; }
    .ap-cat-item.is-open .ap-cat-chevron { transform: rotate(180deg); }
    .ap-cat-sub { display: none; padding: 12px 16px 16px 44px; background: #fafafa; border-top: 1px solid #e5e7eb; }
    .ap-cat-item.is-open .ap-cat-sub { display: block; }
    .ap-cat-sub__label { font-size: 12px; color: #6b7280; margin-bottom: 12px; }
    .ap-cat-sub-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px 16px; }
    .ap-cat-selected { background: #fff7ed; border-color: #f54900; }
    .ap-cat-selected .ap-cat-header { background: #fff7ed; }
    .ap-cat-selected .ap-cat-header__name { color: #f54900; font-weight: 600; }

    /* ── TOP QUALITIES ACCORDION ── */
    .ap-accordion { border: 1px solid #e5e7eb; border-radius: 10px; overflow: hidden; margin-bottom: 8px; }
    .ap-accordion__header { display: flex; align-items: center; padding: 14px 18px; cursor: pointer; background: #fff; user-select: none; gap: 8px; }
    .ap-accordion__header:hover { background: #fafafa; }
    .ap-accordion__title { font-size: 14px; font-weight: 600; color: #101828; flex: 1; }
    .ap-accordion__count { font-size: 12px; color: #9ca3af; margin-right: 12px; }
    .ap-accordion__chevron { width: 16px; height: 16px; color: #9ca3af; transition: transform 0.2s; }
    .ap-accordion.is-open .ap-accordion__chevron { transform: rotate(180deg); }
    .ap-accordion__body { display: none; padding: 16px 18px 18px; background: #fafafa; border-top: 1px solid #e5e7eb; }
    .ap-accordion.is-open .ap-accordion__body { display: block; }
    /* quality cards grid */
    .ap-quality-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .ap-quality-card { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; }
    .ap-quality-card__num { font-size: 13px; color: #9ca3af; font-weight: 500; flex-shrink: 0; min-width: 16px; }
    .ap-quality-card__text { font-size: 14px; font-weight: 600; color: #101828; flex: 1; line-height: 1.4; }
    .ap-quality-card__remove { width: 24px; height: 24px; border: none; background: none; color: #9ca3af; cursor: pointer; font-size: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 4px; }
    .ap-quality-card__remove:hover { color: #dc2626; background: #fef2f2; }
    /* secondary button */
    .ap-btn-secondary { padding: 7px 16px; border: 1.5px solid #2563eb; border-radius: 8px; background: #fff; font-size: 13px; font-weight: 600; color: #2563eb; cursor: pointer; transition: all 0.15s; }
    .ap-btn-secondary:hover { background: #eff6ff; }

    /* ── QUALITIES CHIPS ── */
    .ap-quality-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: #fff7ed; border: 1px solid #f54900; font-size: 12px; font-weight: 500; color: #f54900; margin: 4px 4px 0 0; }
    .ap-quality-chip button { background: none; border: none; cursor: pointer; color: #f54900; font-size: 14px; line-height: 1; padding: 0; }

    /* ── RICH TEXT TOOLBAR ── */
    .ap-rte { border: 1px solid #d1d5db; border-radius: 8px; overflow: hidden; }
    .ap-rte__bar { display: flex; align-items: center; gap: 2px; padding: 6px 10px; background: #f9fafb; border-bottom: 1px solid #e5e7eb; flex-wrap: wrap; }
    .ap-rte__btn { width: 28px; height: 28px; border-radius: 5px; border: none; background: none; color: #374151; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; transition: background 0.1s; }
    .ap-rte__btn:hover { background: #e5e7eb; }
    .ap-rte__select { height: 28px; border: 1px solid #e5e7eb; border-radius: 5px; font-size: 12px; padding: 0 6px; background: #fff; color: #374151; }
    .ap-rte__body { min-height: 140px; padding: 12px; font-size: 14px; color: #101828; line-height: 1.6; outline: none; }
    .ap-rte__tabs { display: flex; }
    .ap-rte__tab { padding: 6px 12px; font-size: 12px; font-weight: 500; color: #6b7280; cursor: pointer; border-bottom: 2px solid transparent; }
    .ap-rte__tab.is-active { color: #f54900; border-bottom-color: #f54900; }

    /* ── OUTCOME GRID ── */
    .ap-outcome-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px 16px; padding: 16px; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 10px; }

    /* ── HIGHLIGHTS ── */
    .ap-highlight-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .ap-highlight-row .ap-input { flex: 1; }
    .ap-highlight-remove { width: 28px; height: 28px; border-radius: 6px; border: 1px solid #fecaca; background: none; color: #dc2626; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
    .ap-add-btn { width: 100%; padding: 11px; border: 1.5px dashed #d1d5db; border-radius: 8px; background: none; font-size: 13px; color: #6b7280; cursor: pointer; text-align: center; transition: all 0.15s; }
    .ap-add-btn:hover { border-color: #f54900; color: #f54900; background: #fff7ed; }

    /* ── PHOTOS ── */
    .ap-upload-box { width: 120px; height: 110px; border: 1.5px dashed #d1d5db; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; cursor: pointer; background: #fff; transition: all 0.15s; color: #9ca3af; }
    .ap-upload-box:hover { border-color: #f54900; color: #f54900; background: #fff7ed; }
    .ap-upload-box svg { opacity: 0.6; }
    .ap-upload-box span { font-size: 12px; font-weight: 500; }
    .ap-gallery-grid { display: flex; gap: 12px; flex-wrap: wrap; }

    /* ── LOCATION SEARCH ── */
    .ap-location-search { display: flex; gap: 10px; }
    .ap-location-search .ap-input { flex: 1; }
    .ap-location-map { width: 100%; height: 220px; border-radius: 10px; background: linear-gradient(135deg,#e0f2fe,#bae6fd); display: flex; align-items: center; justify-content: center; color: #0284c7; font-size: 14px; margin-top: 16px; border: 1px solid #bae6fd; }

    /* ── SCHEDULE ── */
    .ap-responsibility-row { border: 1px solid #e5e7eb; border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; position: relative; }
    .ap-responsibility-row .ap-remove-btn { position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; border-radius: 6px; border: 1px solid #e5e7eb; background: none; color: #9ca3af; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .ap-responsibility-row .ap-remove-btn:hover { border-color: #fecaca; color: #dc2626; }
    .ap-row-label { font-size: 12px; font-weight: 600; color: #374151; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.4px; }

    /* ── AVAILABILITY TABLE ── */
    .ap-avail-table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
    .ap-avail-table th { font-size: 12px; font-weight: 700; color: #374151; padding: 10px 12px; text-align: left; border-bottom: 2px solid #e5e7eb; }
    .ap-avail-table td { padding: 10px 12px; border-bottom: 1px solid #f3f4f6; font-size: 13px; color: #374151; }
    .ap-avail-table th:first-child, .ap-avail-table td:first-child { color: #f54900; font-weight: 600; }
    .ap-avail-actions { display: flex; align-items: center; gap: 10px; }
    .ap-avail-edit { font-size: 13px; color: #2563eb; cursor: pointer; font-weight: 500; }
    .ap-avail-del { width: 24px; height: 24px; border-radius: 999px; border: 1.5px solid #fecaca; background: none; color: #dc2626; cursor: pointer; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
    .ap-avail-note { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; padding: 10px 14px; font-size: 12px; color: #1d4ed8; }
    .ap-avail-row { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr auto; gap: 12px; align-items: end; padding: 16px; background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; margin-bottom: 12px; }
    .ap-avail-row .ap-avail-del-row { width: 32px; height: 32px; border-radius: 999px; border: 1.5px solid #fecaca; background: none; color: #dc2626; cursor: pointer; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-top: 20px; }

    /* ── PRE-SCREENING ── */
    .ap-ps-section { border: 1px solid #e5e7eb; border-radius: 10px; overflow: hidden; margin-bottom: 12px; }
    .ap-ps-header { display: flex; align-items: center; padding: 14px 18px; cursor: pointer; background: #fff; user-select: none; }
    .ap-ps-chevron { width: 16px; height: 16px; color: #9ca3af; transition: transform 0.2s; margin-right: 10px; }
    .ap-ps-section.is-open .ap-ps-chevron { transform: rotate(90deg); }
    .ap-ps-title { font-size: 14px; font-weight: 600; color: #101828; flex: 1; }
    .ap-ps-count { font-size: 12px; color: #9ca3af; margin-right: 12px; }
    .ap-ps-add-btn { padding: 6px 14px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .ap-ps-add-btn:hover { background: #1d4ed8; }
    .ap-ps-body { display: none; padding: 4px 18px 18px; background: #fafafa; border-top: 1px solid #e5e7eb; }
    .ap-ps-section.is-open .ap-ps-body { display: block; }
    .ap-skill-badge-num { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; background: #f3f4f6; font-size: 13px; font-weight: 700; color: #374151; margin-right: 10px; flex-shrink: 0; }
    .ap-skill-badge-num--orange { background: #fff7ed; color: #f54900; }
    .ap-auto-asked-card { border: 1px solid #e5e7eb; border-radius: 10px; padding: 20px; background: #fff; }
    .ap-auto-q { display: flex; align-items: flex-start; gap: 12px; padding: 13px 0; border-bottom: 1px solid #f3f4f6; }
    .ap-auto-q:last-child { border-bottom: none; padding-bottom: 0; }
    .ap-auto-q__num { font-size: 13px; font-weight: 600; color: #9ca3af; flex-shrink: 0; min-width: 18px; }
    .ap-auto-q__text { font-size: 14px; color: #374151; flex: 1; line-height: 1.5; }
    .ap-auto-q__ans { flex-shrink: 0; }

    /* ── MODAL ── */
    .ap-modal-overlay { position: fixed; inset: 0; z-index: 600; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; padding: 24px; }
    .ap-modal { background: #fff; border-radius: 14px; width: 100%; max-width: 520px; max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.18); }
    .ap-modal__head { padding: 20px 24px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e5e7eb; flex-shrink: 0; }
    .ap-modal__title { font-size: 16px; font-weight: 700; color: #101828; }
    .ap-modal__close { width: 28px; height: 28px; border-radius: 6px; border: 1px solid #e5e7eb; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #6b7280; }
    .ap-modal__sub { padding: 12px 24px 0; font-size: 13px; color: #6b7280; flex-shrink: 0; }
    .ap-modal__body { flex: 1; overflow-y: auto; padding: 12px 24px; }
    .ap-modal__item { display: flex; align-items: flex-start; gap: 12px; padding: 11px 12px; border-bottom: 1px solid #f3f4f6; cursor: pointer; border-radius: 6px; }
    .ap-modal__item:hover { background: #f9fafb; }
    .ap-modal__item input[type=checkbox] { width: 15px; height: 15px; accent-color: #f54900; flex-shrink: 0; margin-top: 2px; }
    .ap-modal__item-text { font-size: 13px; color: #374151; line-height: 1.5; }
    .ap-modal__foot { padding: 16px 24px; border-top: 1px solid #e5e7eb; display: flex; justify-content: flex-end; gap: 10px; flex-shrink: 0; }
    .ap-modal__cancel { padding: 9px 20px; border: 1px solid #d1d5db; border-radius: 8px; background: #fff; font-size: 13px; font-weight: 600; color: #374151; cursor: pointer; }
    .ap-modal__confirm { padding: 9px 20px; border-radius: 8px; background: #2563eb; border: none; font-size: 13px; font-weight: 600; color: #fff; cursor: pointer; }
    .ap-modal__confirm:hover { background: #1d4ed8; }

    /* ── NAV FOOTER BUTTONS ── */

const STEPS = [
  { label: 'Details' },

  { label: 'Requirements' },

  { label: 'Locations' },
  { label: 'Schedule' },
  { label: 'Inclusions..' },
  { label: 'Health & Safety' },
  { label: 'Pre-Screening' },
  { label: 'Availability' },
];

let currentStep = 0;
let selectedQualities = [];
let availRows = [{ batch: 'Batch 1', start: '', end: '', cap: 1 }, { batch: 'Batch 2', start: '', end: '', cap: 1 }];

// ── RENDER STEPPER (horizontal top) ──
function renderStepper() {
  const el = document.getElementById('stepperInner');
  if (el) {
    let html = '';
    STEPS.forEach((s, i) => {
      const cls = i < currentStep ? 'is-done' : i === currentStep ? 'is-active' : '';
      html += `<div class="ap-step ${cls}" onclick="goToStep(${i})"><div class="ap-step__num">${i < currentStep ? '\u2713' : i + 1}</div><div class="ap-step__label">${s.label}</div></div>`;
      if (i < STEPS.length - 1) html += `<div class="ap-step-connector ${i < currentStep ? 'is-done' : ''}"></div>`;
    });
    el.innerHTML = html;
  }
  const sub = document.getElementById('apHeaderSub');
  if (sub) sub.textContent = 'Step ' + (currentStep + 1) + ' of ' + STEPS.length + ' — ' + STEPS[currentStep].label;
}

function goToStep(n) {
  if (n > currentStep) return; // only go back to completed steps
  currentStep = n;
  renderStepper();
  renderStep();
  renderFooter();
  window.scrollTo(0, 0);
}

// ── RENDER FOOTER ──
function renderFooter() {
  const el = document.getElementById('apFooterNav');
  const isFirst = currentStep === 0;
  const isLast = currentStep === STEPS.length - 1;
  el.innerHTML = `
    ${!isFirst ? `<button class="ap-btn-back" onclick="prevStep()">Back</button>` : `<div></div>`}
    ${isLast
      ? `<button class="ap-btn-complete" onclick="completeForm()">Complete →</button>`
      : `<button class="ap-btn-continue" onclick="nextStep()">Continue →</button>`
    }`;
}

function nextStep() { if (currentStep < STEPS.length - 1) { currentStep++; renderStepper(); renderStep(); renderFooter(); window.scrollTo(0, 0); } }
function prevStep() { if (currentStep > 0) { currentStep--; renderStepper(); renderStep(); renderFooter(); window.scrollTo(0, 0); } }

function completeForm() {
  toast('Program saved as Draft! Redirecting…');
  setTimeout(() => window.location = 'host-dashboard.html', 1600);
}

// ── RENDER STEP CONTENT ──
function renderStep() {
  const el = document.getElementById('apContent');
  el.innerHTML = STEP_RENDERERS[currentStep]();
}

// ── HELPERS ──
function toggleConditional(id, checkbox, forceShow) {
  const el = document.getElementById(id);
  if (!el) return;
  const show = forceShow !== undefined ? forceShow : (checkbox ? checkbox.checked : false);
  el.style.display = show ? 'block' : 'none';
}
function toggleCat(id) {
  document.getElementById(id).classList.toggle('is-open');
}
function toggleCatCheck(id, cb) {
  const el = document.getElementById(id);
  if (cb.checked) { el.classList.add('ap-cat-selected', 'is-open'); }
  else { el.classList.remove('ap-cat-selected'); }
}
function addHighlight() {
  const list = document.getElementById('highlightList');
  const row = document.createElement('div');
  row.className = 'ap-highlight-row';
  row.innerHTML = `<input class="ap-input" type="text" placeholder="Highlight"><button class="ap-highlight-remove" onclick="removeHighlight(this)">×</button>`;
  list.appendChild(row);
}
function removeHighlight(btn) {
  const rows = document.querySelectorAll('#highlightList .ap-highlight-row');
  if (rows.length > 1) btn.closest('.ap-highlight-row').remove();
}
function addRow(listId, placeholder) {
  const list = document.getElementById(listId);
  const div = document.createElement('div');
  div.innerHTML = renderResponsibilityRow(placeholder, listId);
  list.appendChild(div.firstElementChild);
}
function togglePS(id) {
  document.getElementById(id).classList.toggle('is-open');
}

  document.getElementById('modalBody').innerHTML = QUALITIES.map((q, i) =>
    `<div class="ap-modal__item">
      <input type="checkbox" id="q${i}" ${selectedQualities.includes(q) ? 'checked' : ''} onchange="toggleQuality('${q.replace(/'/g,"\\'")}',this)">
      <label for="q${i}" class="ap-modal__item-text">${i+1}. ${q}</label>
    </div>`
  ).join('');
  document.getElementById('modalConfirm').textContent = 'Add Selected Qualities';
  document.getElementById('modalConfirm').onclick = closeQualitiesModal;
  document.getElementById('apModal').style.display = 'flex';
}

function toggleQuality(q, cb) {
  if (cb.checked) {
    if (selectedQualities.length >= 5) { cb.checked = false; toast('Maximum 5 qualities allowed'); return; }
    selectedQualities.push(q);
  } else {
    selectedQualities = selectedQualities.filter(x => x !== q);
  }
}
function removeQuality(q) {
  selectedQualities = selectedQualities.filter(x => x !== q);
  renderStep();
  document.getElementById('topQualAcc').classList.add('is-open');
}
function closeQualitiesModal() {
  document.getElementById('apModal').style.display = 'none';
  renderStep();
  document.getElementById('topQualAcc').classList.add('is-open');
}

// Pre-screening Q modal
const PS_QUESTIONS = {
  cultural: [
    'Are you physically comfortable with sustained physical or outdoor work for the daily hours stated in this listing?'
  ],
  nonskill: [
    'Are you comfortable performing repetitive or routine tasks where results build slowly over days or weeks?',
    'Are you comfortable working in a cold/ high-altitude climate for the duration? (host picks the condition)'
  ]
};

function openQModal(title, key) {
  const qs = PS_QUESTIONS[key] || [];
  document.getElementById('modalTitle').textContent = 'Add Questions to ' + title;
  document.getElementById('modalSub').innerHTML = '<p style="margin:0;padding-bottom:4px;font-size:13px;color:#374151;">Select questions</p>';
  document.getElementById('modalBody').innerHTML = qs.map((q, i) =>
    `<div class="ap-modal__item">
      <input type="checkbox" id="psq${key}${i}">
      <label for="psq${key}${i}" class="ap-modal__item-text">${i+1}. ${q}</label>
    </div>`
  ).join('');
  document.getElementById('modalConfirm').textContent = 'Add Selected Questions';
  document.getElementById('modalConfirm').onclick = () => {
    const count = document.querySelectorAll(`#modalBody input:checked`).length;
    if (count > 0) {
      const el = document.getElementById('ps-' + key);
      if (el) {
        el.querySelector('.ap-ps-count').textContent = count + ' Question' + (count>1?'s':'');
      }
      toast(count + ' question' + (count>1?'s':'')+' added');
    }
    closeModal();
  };
  document.getElementById('apModal').style.display = 'flex';
}

function closeModal() {
  document.getElementById('apModal').style.display = 'none';
}

// Availability
function addAvailRow() {
  availRows.push({ batch: 'Batch ' + (availRows.length + 1), start: '', end: '', cap: 1 });
  renderStep();
}
function removeAvailRow(i) {
  if (availRows.length <= 1) return;
  availRows.splice(i, 1);
  renderStep();
}
function refreshAvailTable() {
  const tbody = document.getElementById('availTableBody');
  if (!tbody) return;
  tbody.innerHTML = availRows.map(r => `<tr>
    <td>${r.batch}</td><td>${r.start||'–'}</td><td>${r.end||'–'}</td><td>${r.cap}</td>
    <td><div class="ap-avail-actions"><span class="ap-avail-edit">Edit</span><button class="ap-avail-del">×</button></div></td>
  </tr>`).join('');
}

// Toast
function toast(msg) {
  const el = document.getElementById('apToast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

// ── INIT ──
renderStepper();
renderStep();
renderFooter();
</script>
</body>
</html>
